services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoiselokalis-app
    ports:
      - "8080:80"
    env_file:
      - .env.docker
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      - .:/var/www/html
      - ./.env.docker:/var/www/html/.env:ro
      - vendor:/var/www/html/vendor
      - writable:/var/www/html/writable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: invoiselokalis-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: invoiselokalis
      MYSQL_USER: invoise
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: invoiselokalis-pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
  vendor:
  writable: